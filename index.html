/* ============================================================
   IDENTIDAD · minimalista. Todo se controla desde el tema (colores y
   tipografías globales) y desde los ajustes de cada bloque.
   ============================================================ */
:root {
  --bg: #FAF9F7;
  --indigo: #4640B5;
  --tinta: #1B1840;
  --suave: color-mix(in srgb, var(--tinta) 58%, var(--bg));
  --linea: color-mix(in srgb, var(--tinta) 16%, var(--bg));
  --pendiente: color-mix(in srgb, var(--indigo) 14%, var(--bg));

  --foto-filtro: grayscale(1) contrast(1.05);

  --f-titulo: "PP Mori", "Helvetica Neue", Arial, sans-serif;
  --f-texto: "Open Sauce One", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --ui-bg: #FFFFFF; --ui-tinta: #1B1840; --ui-acc: #4640B5; --ui-linea: #D9D6EA; --ui-suave: #67638F;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--tinta);
  font-family: var(--f-texto); font-weight: 300; font-size: 18px; line-height: 1.65;
  -webkit-font-smoothing: antialiased; font-synthesis: none;
}
img { display: block; max-width: 100%; border-radius: 0; }
a { color: inherit; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--f-titulo); font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: var(--indigo); text-transform: lowercase; }
html[data-min="0"] :is(h1, h2, h3, h4, .nombre, .marca) { text-transform: none; }
.mono { font-family: var(--f-mono); font-weight: 400; font-size: 12px; letter-spacing: .02em; line-height: 1.6; }
.ml { white-space: pre-line; }
.pendiente { background: var(--pendiente); outline: 1.5px dashed var(--indigo); outline-offset: 1px; padding: 0 3px; color: inherit; }
.vert { position: absolute; writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; color: var(--suave); white-space: nowrap; }

/* Trazos a lápiz */
.deco { position: absolute; color: var(--indigo); pointer-events: none; overflow: visible; opacity: .8; mix-blend-mode: multiply; filter: url(#lapiz); }
.deco path, .deco line { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.hw { position: relative; display: inline-block; }
h2.hw, h3.hw, div.hw { display: block; width: fit-content; }

/* Botones */
.btn { display: inline-block; padding: 12px 22px; border: 1.5px solid var(--indigo); color: var(--indigo); font-family: var(--f-mono); font-size: 13px; text-decoration: none; background: transparent; cursor: pointer; }
.btn:hover, .btn.lleno { background: var(--indigo); color: var(--bg); }
.btn.lleno:hover { background: var(--tinta); border-color: var(--tinta); }

/* Navegación */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--linea); }
.nav:empty { display: none; }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 58px; }
.nav .marca { font-family: var(--f-titulo); font-weight: 600; font-size: 18px; letter-spacing: -.02em; text-decoration: none; color: var(--indigo); text-transform: lowercase; white-space: nowrap; }
.nav ul { display: flex; align-items: center; gap: 26px; list-style: none; }
.nav a.enlace { text-decoration: none; color: var(--indigo); }
.nav a.enlace:hover { text-decoration: underline; text-underline-offset: 4px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }

/* ---------- Bloque (sección) ---------- */
.blk { --suave: color-mix(in srgb, var(--tinta) 58%, var(--bg)); --linea: color-mix(in srgb, var(--tinta) 16%, var(--bg)); --pendiente: color-mix(in srgb, var(--indigo) 14%, var(--bg));
  background: var(--bg); color: var(--tinta); position: relative; padding-block: var(--p, 104px); }
.blk[data-esp="xs"] { --p: 24px; } .blk[data-esp="s"] { --p: 56px; } .blk[data-esp="m"] { --p: 104px; } .blk[data-esp="l"] { --p: 160px; } .blk[data-esp="xl"] { --p: 230px; }
.blk[data-borde="linea"] { border-top: 1px solid var(--linea); }
.blk[data-borde="acento"] { border-top: 1px solid var(--indigo); }
.blk[data-fotos="bn"] img { filter: var(--foto-filtro); }
.blk[data-fotos="color"] img { filter: none; }
.blk.al-c { text-align: center; }
.blk.al-c .hw { margin-inline: auto; }
.blk.al-c .lead { margin-inline: auto; }
.blk.al-c .botones { justify-content: center; }
.tt { font-size: calc(clamp(40px, 6vw, 84px) * var(--k, 1)); }
.kick { color: var(--suave); display: block; }
.cab { display: grid; gap: 12px; margin-bottom: 48px; justify-items: start; }
.al-c .cab { justify-items: center; }
.lead { font-family: var(--f-mono); font-size: 14px; line-height: 1.75; max-width: 52ch; }
.addrow { margin-top: 18px; }
.foto-vacia { aspect-ratio: 4/5; display: grid; place-items: center; border: 1.5px dashed var(--indigo); color: var(--indigo); font-family: var(--f-mono); font-size: 13px; }

/* Portada */
.blk.b-portada { padding-block: 0; overflow: hidden; }
.hero3 { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 64px; align-items: center; padding-block: 64px 88px; min-height: calc(100svh - 58px); }
.hero3.inv .hero3-foto { order: -1; }
.hero3-txt { display: grid; gap: 28px; justify-items: start; position: relative; }
.nombre { font-family: var(--f-titulo); font-weight: 600; font-size: clamp(64px, 10.4vw, 156px); line-height: .86; letter-spacing: -.055em; color: var(--indigo); text-transform: lowercase; }
.nombre > span { display: block; width: min-content; padding-bottom: .04em; }
.hero3 h1 { font-size: clamp(26px, 2.6vw, 38px); line-height: 1.12; max-width: 17ch; }
.hero3 h1 em { font-style: normal; position: relative; display: inline-block; padding-inline: .12em; }
.hero3 .lead { color: var(--tinta); max-width: 40ch; }
.hero3-foto { position: relative; }
.hero3-foto img, .hero3-foto .foto-vacia { width: 100%; aspect-ratio: 4/5; max-height: calc(100svh - 150px); object-fit: cover; object-position: 50% 30%; }
.hero3-foto .vert { left: calc(100% + 14px); bottom: 0; }
.hero3.inv .hero3-foto .vert { left: auto; right: calc(100% + 14px); }

/* Cifras */
.cifras { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 28px; }
.cifra { position: relative; }
.cifra .n { font-family: var(--f-titulo); font-weight: 600; font-size: clamp(46px, 6vw, 88px); line-height: .92; letter-spacing: -.045em; color: var(--indigo); }
.cifra .t { margin-top: 14px; font-family: var(--f-mono); font-size: 12px; line-height: 1.6; color: var(--suave); max-width: 26ch; }

/* Historia */
.rejilla { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 72px; align-items: start; }
.capitulo { position: relative; display: grid; grid-template-columns: 56px 1fr; gap: 6px 18px; padding-block: 28px; border-top: 1px solid var(--linea); }
.capitulo .num { font-family: var(--f-mono); font-size: 13px; color: var(--indigo); padding-top: 8px; }
.capitulo h3 { font-size: clamp(26px, 2.6vw, 36px); margin-bottom: 12px; }
.capitulo .tx { white-space: pre-line; }
.colfotos { position: sticky; top: 90px; }
.fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.fotos .ph { position: relative; }
.fotos img { width: 100%; aspect-ratio: 3/4; object-fit: cover; }
.colfotos .fotos .ph:nth-child(2) { margin-top: 56px; }
.colfotos .vert { right: -26px; top: 0; }

/* Capítulos de la experiencia */
.caps { display: grid; gap: 110px; }
.cap { position: relative; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 72px; align-items: center; }
.cap.alt .cap-foto { order: -1; }
.cap.sinfoto { grid-template-columns: minmax(0, 1fr); }
.cap-num { font-family: var(--f-titulo); font-weight: 600; font-size: clamp(96px, 14vw, 200px); line-height: .8; letter-spacing: -.06em; color: transparent; -webkit-text-stroke: 1.6px var(--indigo); caret-color: var(--indigo); }
.cap h3 { font-size: clamp(32px, 4vw, 56px); line-height: .98; margin: 22px 0 20px; }
.cap .tx { max-width: 46ch; font-size: 19px; }
.cap-apr { margin-top: 24px; max-width: 40ch; font-family: var(--f-mono); font-size: 13px; line-height: 1.65; color: var(--indigo); border-left: 2px solid var(--indigo); padding-left: 14px; }
.cap-foto { position: relative; max-width: 440px; width: 100%; justify-self: center; }
.cap-foto::before { content: ""; position: absolute; inset: 18px -18px -18px 18px; border: 1.5px solid var(--indigo); }
.cap.alt .cap-foto::before { inset: 18px 18px -18px -18px; }
.cap-foto img, .cap-foto .foto-vacia { position: relative; width: 100%; aspect-ratio: 4/5; object-fit: cover; background: var(--bg); }
.cap-foto.hor { max-width: 500px; }
.cap-foto.hor > img { aspect-ratio: auto; height: auto; }
.cap-foto.dos { margin-bottom: 64px; }
.cap-foto .f2 { position: absolute; right: -22px; bottom: -58px; width: 54%; z-index: 2; border: 8px solid var(--bg); background: var(--bg); }
.cap-foto .f2 img { aspect-ratio: auto; height: auto; display: block; }
.cap-foto .f2 .foto-vacia { aspect-ratio: 4/3; font-size: .8rem; }
.botones.peq .btn { padding: 8px 16px; font-size: 12px; }
.cap .x { top: -8px; right: -8px; }

/* Línea de tiempo */
.tl { margin-top: 8px; }
.tl-item { position: relative; display: grid; grid-template-columns: 130px 22px minmax(0, 1fr); gap: 0 20px; padding-bottom: 44px; }
.tl-fecha { color: var(--indigo); padding-top: 6px; white-space: nowrap; }
.tl-eje { position: relative; }
.tl-eje::before { content: ""; position: absolute; left: 10px; top: 14px; bottom: -14px; width: 1.5px; background: var(--indigo); opacity: .45; }
.tl-item:last-child .tl-eje::before { display: none; }
.tl-eje::after { content: ""; position: absolute; left: 3px; top: 8px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--indigo); background: var(--bg); }
.tl-item:first-child .tl-eje::after { background: var(--indigo); }
.tl-cont h3 { font-size: clamp(24px, 2.4vw, 34px); line-height: 1.02; }
.tl-lugar { color: var(--suave); margin-top: 6px; }
.tl-d { margin-top: 12px; max-width: 52ch; font-size: 17px; }
.tl-aprendi { margin-top: 14px; max-width: 46ch; font-family: var(--f-mono); font-size: 13px; line-height: 1.6; color: var(--indigo); border-left: 2px solid var(--indigo); padding-left: 12px; }
.tl-item .x { top: 0; right: 0; }

/* Casos */
.caso { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 28px 64px; }
.caso-izq { display: grid; gap: 18px; align-content: start; justify-items: start; }
.caso-izq .etiqueta { color: var(--suave); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.b-caso .tt { font-size: calc(clamp(36px, 4.6vw, 68px) * var(--k, 1)); letter-spacing: -.045em; line-height: .94; padding-bottom: .1em; }
.gancho { font-size: 20px; line-height: 1.35; max-width: 28ch; }
.contexto { font-family: var(--f-mono); font-size: 12px; color: var(--suave); }
.caso-der { display: grid; gap: 28px; align-content: start; }
.datos { display: grid; gap: 18px; }
.dato { position: relative; display: grid; grid-template-columns: 110px 1fr; gap: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--linea); }
.dato h4 { font-family: var(--f-mono); font-weight: 400; font-size: 12px; letter-spacing: .04em; color: var(--indigo); text-transform: none; padding-top: 4px; }
.dato p { font-size: 17px; }
.resultado { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.resultado .grande { font-family: var(--f-titulo); font-weight: 600; font-size: clamp(56px, 7.4vw, 112px); line-height: .9; letter-spacing: -.05em; color: var(--indigo); white-space: nowrap; }
.resultado p { font-family: var(--f-mono); font-size: 13px; line-height: 1.7; max-width: 40ch; }
.proceso { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
.paso { position: relative; padding-top: 14px; border-top: 1.5px solid var(--indigo); }
.paso h4 { font-size: 22px; margin-bottom: 8px; }
.paso p { font-family: var(--f-mono); font-size: 13px; line-height: 1.7; }
.aprendi { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
.aprendi .mono { color: var(--indigo); text-decoration: underline; text-underline-offset: 4px; }
.aprendi p { font-size: 19px; max-width: 48ch; }
.caso > .addrow { grid-column: 1 / -1; margin: 0; }
.videos { grid-column: 1 / -1; display: flex; gap: 16px; flex-wrap: wrap; }
.video { position: relative; aspect-ratio: 16/9; width: min(440px, 100%); display: grid; place-items: center; text-align: center; border: 1.5px solid var(--indigo); color: var(--indigo); text-decoration: none; font-family: var(--f-mono); font-size: 13px; background: transparent; }
a.video:hover { background: var(--indigo); color: var(--bg); }
.video.vacio { border-style: dashed; }
.video .play { width: 46px; height: 46px; border: 1.5px solid currentColor; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 10px; }
.video .play::after { content: ""; border-left: 12px solid currentColor; border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 4px; }
.video small { display: block; opacity: .7; font-size: 11px; margin-top: 2px; }
.b-video .videos { margin-top: 8px; }

/* Tarjetas */
.items { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 32px; }
.item { position: relative; border-top: 1.5px solid var(--indigo); padding-top: 18px; display: grid; gap: 10px; align-content: start; }
.item h3 { font-size: 28px; }
.item .meta { color: var(--suave); }
.item .cuerpo { font-size: 16px; }

/* Texto + foto */
.rejilla2 { display: grid; grid-template-columns: minmax(0, .7fr) minmax(0, 1.3fr); gap: 72px; align-items: center; }
.rejilla2.inv { grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr); }
.rejilla2.inv .fcol { order: 2; }
.rejilla2 img, .rejilla2 .foto-vacia { width: 100%; aspect-ratio: 4/5; object-fit: cover; }
.rejilla2 .cab { margin-bottom: 0; }
.rejilla2 .lead { font-family: var(--f-texto); font-size: 20px; line-height: 1.55; max-width: 46ch; margin-top: 12px; }
.ejemplo { margin-top: 28px; padding: 18px 22px; border: 1.5px solid var(--indigo); font-family: var(--f-mono); font-size: 13px; line-height: 1.7; }

/* Lista */
.lista { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); gap: 0 56px; }
.fila { position: relative; padding-block: 18px; border-top: 1px solid var(--linea); }
.fila strong { display: block; font-family: var(--f-titulo); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: var(--indigo); }
.fila .d { font-family: var(--f-mono); font-size: 12px; color: var(--suave); }

/* Galería y foto */
.g { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 14px; }
.g .ph { position: relative; }
.g img { width: 100%; aspect-ratio: var(--r, 4/5); object-fit: cover; }
.fotoG .ph { position: relative; }
.fotoG img, .fotoG .foto-vacia { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
.fotoG[data-r="21-9"] img, .fotoG[data-r="21-9"] .foto-vacia { aspect-ratio: 21/9; }
.fotoG[data-r="4-5"] .ph { max-width: 560px; margin-inline: auto; }
.fotoG[data-r="4-5"] img, .fotoG[data-r="4-5"] .foto-vacia { aspect-ratio: 4/5; }
.fotoG[data-r="full"] img { max-height: 100svh; }
.blk.b-foto.sinpad { padding-block: 0; }
.blk.b-seccion { padding-bottom: calc(var(--p, 104px) * .4); }
.b-seccion .cab { margin-bottom: 0; }
.pie-foto { margin-top: 12px; color: var(--suave); }

/* Logos */
.logos { display: flex; flex-wrap: wrap; gap: 26px 48px; align-items: center; }
.logo { position: relative; display: flex; align-items: center; gap: 8px; min-height: 36px; }
.lg { display: block; flex: none; background: var(--indigo); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: left center; mask-position: left center; }
.logo img.lgi { display: block; flex: none; object-fit: contain; filter: none !important; }
.logo-n { font-family: var(--f-mono); font-size: 12px; color: var(--indigo); }
.logo.conimg .logo-n { display: none; }
body.editando .logo.conimg .logo-n { display: block; font-size: 10px; color: var(--suave); }
body.editando .logo.conimg { flex-direction: column; align-items: flex-start; gap: 2px; }
.logo-add { border: 1.5px dashed var(--indigo); color: var(--indigo); font: 11px var(--f-mono); padding: 4px 8px; cursor: pointer; }
.logo .x { top: -10px; right: -12px; width: 20px; height: 20px; font-size: 13px; line-height: 20px; }
.item .cuerpo { white-space: pre-line; }

/* Etiquetas */
.marcas { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.marcas span.chip { position: relative; display: inline-block; padding: 6px 12px; border: 1px solid var(--linea); font-family: var(--f-mono); font-size: 12px; color: var(--indigo); }

/* Cita */
.cita { max-width: 30ch; font-family: var(--f-titulo); font-weight: 600; font-size: calc(clamp(26px, 3.4vw, 46px) * var(--k, 1)); line-height: 1.1; letter-spacing: -.04em; color: var(--indigo); text-transform: lowercase; }
.al-c .cita { margin-inline: auto; }
.cita .autor { display: block; margin-top: 24px; font-size: 12px; letter-spacing: .02em; text-transform: none; color: var(--suave); }
html[data-min="0"] .cita { text-transform: none; }

/* Contacto */
.blk.b-contacto { overflow: hidden; padding-block: calc(var(--p, 104px) * 1.2); }
.b-contacto .tt { font-size: calc(clamp(64px, 15vw, 220px) * var(--k, 1)); line-height: .85; letter-spacing: -.06em; padding-bottom: .08em; }
.b-contacto .lead { margin: 40px 0 32px; max-width: 46ch; }
.b-contacto.al-c .lead { margin-inline: auto; }
.botones { display: flex; gap: 12px; flex-wrap: wrap; }

/* Espacio */
.b-espacio { padding-block: var(--p, 104px); }
.vacio-esp { height: 0; }

footer { padding: 24px 0 40px; text-align: center; color: var(--suave); border-top: 1px solid var(--linea); }

/* ---------- Móvil ---------- */
@media (max-width: 900px) {
  body { font-size: 17px; }
  .blk { padding-block: calc(var(--p, 104px) * .62); }
  .blk.b-seccion { padding-bottom: calc(var(--p, 104px) * .3); }
  .blk.b-contacto { padding-block: calc(var(--p, 104px) * .8); }
  .nav ul { gap: 14px; }
  .nav ul li:nth-child(n+2):not(:last-child) { display: none; }
  .hero3 { grid-template-columns: 1fr; gap: 28px; padding-block: 24px 56px; min-height: 0; }
  .hero3-foto, .hero3.inv .hero3-foto { order: -1; }
  .hero3-foto img { max-height: none; }
  .hero3-foto .vert { display: none; }
  .nombre { font-size: 19vw; }
  .hero3 .lead { display: none; }
  .cifras { grid-template-columns: 1fr 1fr; }
  .rejilla, .rejilla2, .rejilla2.inv { grid-template-columns: 1fr; gap: 40px; }
  .rejilla2.inv .fcol { order: 0; }
  .colfotos { position: static; }
  .colfotos .vert { display: none; }
  .capitulo { grid-template-columns: 38px 1fr; }
  .caps { gap: 72px; }
  .cap { grid-template-columns: minmax(0, 1fr); gap: 36px; }
  .cap.alt .cap-foto { order: 0; }
  .cap-foto { max-width: 340px; margin-right: 18px; }
  .tl-item { grid-template-columns: 22px minmax(0, 1fr); gap: 0 14px; }
  .tl-fecha { grid-area: 1 / 2; padding-top: 0; }
  .tl-eje { grid-area: 1 / 1 / 3 / 2; }
  .tl-cont { grid-area: 2 / 2; margin-top: 6px; }
  .caso { grid-template-columns: 1fr; gap: 24px; }
  .dato { grid-template-columns: 1fr; gap: 4px; }
  .proceso, .items, .lista { grid-template-columns: 1fr; }
  .g { grid-template-columns: repeat(min(var(--cols, 3), 2), 1fr); }
  .deco[style*="calc(100% + .3em)"] { display: none; }
}

/* ============================================================
   EDITOR DE BLOQUES
   ============================================================ */
body.editando [data-p] { outline: 1.5px dashed color-mix(in srgb, var(--indigo) 50%, transparent); outline-offset: 3px; cursor: text; min-width: 1ch; }
body.editando [data-p]:hover { background: var(--pendiente); }
body.editando [data-p]:focus { outline: 2px solid var(--indigo); background: var(--pendiente); }
body.editando [data-p]:empty::before { content: attr(data-ph); opacity: .45; }
body.editando [data-img] { cursor: pointer; outline: 2px dashed var(--indigo); outline-offset: -4px; }
body.editando .blk { min-height: 40px; }
body.editando .blk[data-oculto] { opacity: .32; }
body.editando .blk[data-oculto]::after { content: "oculto para los visitantes"; position: absolute; right: 12px; bottom: 8px; font: 11px var(--f-mono); color: var(--tinta); background: var(--bg); padding: 2px 8px; border: 1px dashed var(--indigo); }
body.editando .blk.hov { outline: 1.5px solid color-mix(in srgb, var(--ui-acc) 55%, transparent); outline-offset: -2px; }
body.editando .blk.sel { outline: 3px solid var(--ui-acc); outline-offset: -3px; }
body.editando .b-espacio::before { content: "espacio"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 11px var(--f-mono); color: var(--suave); border: 1px dashed var(--suave); padding: 2px 10px; }
body.editando .b-espacio { min-height: 56px; }

/* botones × y + añadir */
.x { position: absolute; top: 4px; right: 4px; z-index: 5; width: 24px; height: 24px; line-height: 1; border: 0; border-radius: 50%; background: var(--ui-acc); color: #fff; font: 15px/24px var(--f-mono); cursor: pointer; padding: 0; text-align: center; }
.x:hover { background: #C0392B; }
.add { background: var(--ui-bg); color: var(--ui-acc); border: 1.5px dashed var(--ui-acc); padding: 7px 14px; font: 12px var(--f-mono); cursor: pointer; }
.add:hover { background: var(--ui-acc); color: #fff; }
.marcas .x { top: -9px; right: -9px; width: 20px; height: 20px; font-size: 13px; line-height: 20px; }

/* barra inferior */
.edbar { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 8px 10px 8px 16px; background: var(--ui-acc); color: #fff; max-width: calc(100vw - 20px); box-shadow: 0 12px 32px -14px rgba(27,24,64,.65); font-family: var(--f-mono); }
.edbar .estado { font-size: 12px; margin-right: 4px; }
.edbar button { border: 1.5px solid #fff; background: transparent; color: #fff; padding: 7px 12px; font: 12px var(--f-mono); cursor: pointer; }
.edbar button:hover:not(:disabled), .edbar button.lleno { background: #fff; color: var(--ui-acc); }
.edbar button:disabled { opacity: .4; cursor: default; }
.edbar button.on { background: #fff; color: var(--ui-acc); }
#b-grupo[hidden], #b-editar[hidden] { display: none !important; }
.edbar .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.4); margin: 0 4px; }
body.conpanel .edbar { left: calc(50% - 170px); }

/* barra flotante del bloque */
.btb { position: fixed; z-index: 55; display: none; align-items: center; gap: 2px; background: var(--ui-tinta); padding: 3px; box-shadow: 0 8px 22px -8px rgba(27,24,64,.6); font-family: var(--f-mono); max-width: calc(100vw - 16px); flex-wrap: wrap; }
.btb .lbl { color: #fff; opacity: .65; font-size: 11px; padding: 0 8px; }
.btb button, .btb .grab { background: transparent; color: #fff; border: 0; padding: 6px 9px; font: 12px var(--f-mono); cursor: pointer; }
.btb button:hover, .btb .grab:hover { background: var(--ui-acc); }
.btb button.pel:hover { background: #C0392B; }
.btb .grab { cursor: grab; user-select: none; }
.drop { position: fixed; z-index: 58; left: 0; right: 0; height: 4px; background: var(--ui-acc); pointer-events: none; display: none; }

/* panel lateral */
#pnl { position: fixed; z-index: 62; top: 0; right: 0; bottom: 0; width: 340px; background: var(--ui-bg); color: var(--ui-tinta); border-left: 1.5px solid var(--ui-acc); overflow: auto; padding: 16px 16px 90px; font-family: var(--f-mono); font-size: 12px; line-height: 1.5; display: none; }
#pnl h4 { font-family: var(--f-mono); font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--ui-suave); font-size: 11px; margin: 18px 0 8px; }
#pnl .cab2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 14px; color: var(--ui-acc); }
#pnl .cab2 b { font-weight: 700; }
#pnl button { font: 12px var(--f-mono); cursor: pointer; }
#pnl .cerrar { border: 0; background: transparent; font-size: 22px; line-height: 1; color: var(--ui-tinta); }
#pnl .fl { display: grid; grid-template-columns: 112px 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
#pnl label { color: var(--ui-tinta); }
#pnl select, #pnl input[type=text], #pnl textarea { width: 100%; font: 12px var(--f-mono); padding: 6px 8px; border: 1px solid var(--ui-linea); background: #fff; color: var(--ui-tinta); border-radius: 0; }
#pnl textarea { min-height: 84px; resize: vertical; grid-column: 1 / -1; }
#pnl input[type=color] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--ui-linea); background: #fff; cursor: pointer; }
#pnl .colctl { display: flex; gap: 8px; align-items: center; }
#pnl .colctl button { border: 1px solid var(--ui-linea); background: #fff; padding: 4px 8px; color: var(--ui-suave); }
#pnl .colctl button:disabled { opacity: .35; cursor: default; }
#pnl .presets { display: flex; flex-wrap: wrap; gap: 8px; }
#pnl .presets button { width: 58px; height: 40px; border: 1.5px solid var(--ui-linea); font: 11px var(--f-mono); padding: 0; }
#pnl .presets button:hover { border-color: var(--ui-acc); }
#pnl .btn2 { border: 1.5px solid var(--ui-acc); background: #fff; color: var(--ui-acc); padding: 7px 12px; }
#pnl .btn2:hover { background: var(--ui-acc); color: #fff; }
#pnl .btn2.peligro { border-color: #C0392B; color: #C0392B; }
#pnl .btn2.peligro:hover { background: #C0392B; color: #fff; }
#pnl .nota { color: var(--ui-suave); margin: 4px 0 10px; }
#pnl .tipos { display: grid; gap: 8px; }
#pnl .tipos button { text-align: left; border: 1.5px solid var(--ui-linea); background: #fff; padding: 10px 12px; color: var(--ui-tinta); }
#pnl .tipos button:hover { border-color: var(--ui-acc); background: #F2F1FB; }
#pnl .tipos b { display: block; color: var(--ui-acc); font-size: 13px; }
#pnl .tipos span { color: var(--ui-suave); font-size: 11px; }

          inp.click();
        }
        else if (a === "encvq") { ENL.cv = Object.assign({}, ENL.cv, { [x.dataset.l]: "" }); guardarEnlaces().then(pintarPanel); }
        else if (a === "tema0") { snap(true); P.tema = Object.assign({}, TEMA0); aplicarTema(); pintarPanel(); contar(); }
        else if (a === "navadd") { snap(true); P.nav.items.push({ t: "enlace", a: "" }); pintar(); pintarPanel(); contar(); }
        else if (a === "cvsubir") pnl.querySelector("#cv-file").click();
        else if (a === "cvquitar") { snap(true); delete P.cvUrl; pintarPanel(); contar(); }
        else if (a === "addfin") { insertarEn = null; abrirPanel("anadir"); }
      } else if ((x = g("data-preset"))) {
        const p = PRESETS.find((q) => q[0] === x.dataset.preset), b = blk(); if (!b) return;
        snap(true); b.estilo = Object.assign(b.estilo || {}, { bg: p[1], tinta: p[2], acento: p[3] }); syncEstilo(b); pintarPanel(); contar();
      } else if ((x = g("data-paleta"))) {
        snap(true); P.tema.bg = x.dataset.bgp; P.tema.tinta = x.dataset.paleta.split(",")[1]; P.tema.indigo = x.dataset.paleta.split(",")[2]; aplicarTema(); pintarPanel(); contar();
      } else if ((x = g("data-clear"))) {
        const b = blk(); snap(true); setP(b, x.dataset.clear, ""); syncEstilo(b); pintarPanel(); contar();
      } else if ((x = g("data-nuevo"))) insertar(x.dataset.nuevo);
      else if ((x = g("data-ir"))) { seleccionar(x.dataset.ir); aVista(x.dataset.ir); pintarPanel(); }
      else if ((x = g("data-cm"))) {
        const id = x.dataset.id, a = x.dataset.cm;
        if (a === "up") mover(id, -1); else if (a === "down") mover(id, 1); else if (a === "ocu") ocultar(id); else if (a === "del") eliminar(id);
      } else if ((x = g("data-nvdel"))) { snap(true); P.nav.items.splice(+x.dataset.nvdel, 1); pintar(); pintarPanel(); contar(); }
    });
    const ctl = (e, final) => {
      const el = e.target, ty = el.dataset && el.dataset.t; if (!ty) return;
      if (!final && (ty === "sel" || ty === "nva" || ty === "nvb" || ty === "nv")) return;
      if (final && (ty === "col" || ty === "txt" || ty === "lines" || ty === "nvt")) return;
      if (ty === "th") {
        snap(false); const k = el.dataset.th; P.tema[k] = el.type === "checkbox" ? el.checked : el.value; aplicarTema(); contar(); return;
      }
      if (ty === "nv") { snap(true); P.nav.oculto = !el.checked; pintar(); contar(); return; }
      if (ty === "nvt") { snap(false); P.nav.items[+el.dataset.j].t = el.value; pintar(); contar(); return; }
      if (ty === "nvb") { snap(true); P.nav.items[+el.dataset.j].btn = el.checked; pintar(); contar(); return; }
      if (ty === "nva") {
        snap(true); const it = P.nav.items[+el.dataset.j], b = blk(el.value);
        if (b) { if (!b.ancla) b.ancla = slug(b.titulo || b.nombre || NOMBRES[b.tipo][0]) || "seccion-" + b.id; it.a = b.ancla; } else it.a = "";
        pintar(); pintarPanel(); contar(); return;
      }
      const b = blk(); if (!b) return;
      const k = el.dataset.k; snap(false);
      if (ty === "lines") setP(b, k, el.value.split("\n").map((s) => s.trim()).filter(Boolean));
      else if (ty === "txt" && k === "ancla") setP(b, k, slug(el.value));
      else setP(b, k, el.value);
      if (k.startsWith("estilo.")) { syncEstilo(b); } else { pintar(); }
      if (ty === "col") { const bt = pnl.querySelector(`[data-clear="${k}"]`); if (bt) bt.disabled = false; }
      contar();
    };
    pnl.addEventListener("change", async (e) => {
      if (e.target.id !== "cv-file") return;
      const f = e.target.files && e.target.files[0]; if (!f || !assetsApi) return;
      try { avisar("Subiendo CV…"); const r = await assetsApi.upload(f); snap(true); P.cvUrl = r.url; pintarPanel(); contar(); avisar("CV subido. Pulsa guardar."); }
      catch (err) { avisar("No se pudo subir: " + (err && err.message ? err.message : "error")); }
    });
    pnl.addEventListener("change", (e) => {
      const k = e.target.dataset && e.target.dataset.en; if (!k) return;
      let v = String(e.target.value || "").trim(); if (v && !/^(https?:|mailto:|cv\/|\/)/i.test(v)) v = "https://" + v;
      e.target.value = v;
      if (k === "linkedin") ENL.linkedin = v; else { const l = k.split(".")[1]; ENL.cv = Object.assign({}, ENL.cv, { [l]: v }); }
      guardarEnlaces().then(() => { if (k !== "linkedin") pintarPanel(); });
    });
    pnl.addEventListener("input", (e) => ctl(e, false));
    pnl.addEventListener("change", (e) => ctl(e, true));
  }

  /* ---------- Barra inferior, guardar y salir ---------- */
  let bar, estado;
  const dirty = () => JSON.stringify(P) !== saved;
  function contar() { if (estado) { estado.textContent = dirty() ? "Cambios sin guardar" : "Sin cambios"; } actualizarBarra(); }
  function actualizarBarra() {
    if (!bar) return;
    const q = (s) => bar.querySelector(s);
    q("#b-undo").disabled = !undo.length; q("#b-redo").disabled = !redo.length;
    ["anadir", "capas", "menu", "tema", "enlaces"].forEach((m) => q("#b-" + m).classList.toggle("on", panel === m));
    q("#b-salir").textContent = salirArmado ? "¿salir sin guardar?" : "salir";
  }
  function montarBarra() {
    bar = document.createElement("div"); bar.className = "edbar";
    bar.innerHTML = `<span class="estado">Edición</span><span class="edlang" id="b-lang"></span><button id="b-editar" class="lleno">editar</button><span id="b-grupo" style="display:contents" hidden>
      <button id="b-undo" title="deshacer">↶</button><button id="b-redo" title="rehacer">↷</button><span class="sep"></span>
      <button id="b-anadir">+ bloque</button><button id="b-capas">orden</button><button id="b-menu">menú</button><button id="b-tema">tema</button><button id="b-enlaces">enlaces</button><span class="sep"></span>
      <button id="b-guardar" class="lleno">guardar</button><button id="b-salir">salir</button></span>`;
    document.body.appendChild(bar); estado = bar.querySelector(".estado");
    montarBtb(); montarPanel();
    const q = (s) => bar.querySelector(s);
    q("#b-editar").addEventListener("click", () => {
      editando = true; undo = []; redo = []; pintar();
      q("#b-editar").hidden = true; q("#b-grupo").hidden = false; estado.textContent = "Clic en un texto para escribir · clic en un bloque para ajustarlo"; contar();
    });
    q("#b-undo").addEventListener("click", deshacer); q("#b-redo").addEventListener("click", rehacer);
    q("#b-anadir").addEventListener("click", () => { insertarEn = null; abrirPanel("anadir"); });
    q("#b-capas").addEventListener("click", () => abrirPanel("capas"));
    q("#b-menu").addEventListener("click", () => abrirPanel("menu"));
    q("#b-tema").addEventListener("click", () => abrirPanel("tema"));
    q("#b-enlaces").addEventListener("click", () => abrirPanel("enlaces"));
    q("#b-guardar").addEventListener("click", guardar);
    q("#b-salir").addEventListener("click", () => {
      if (dirty() && !salirArmado) { salirArmado = true; actualizarBarra(); setTimeout(() => { salirArmado = false; actualizarBarra(); }, 3500); return; }
      salir();
    });
  }
  async function guardar() {
    if (!doc) return avisar("No se puede guardar aquí: abre la página desde tu cuenta");
    const b = bar.querySelector("#b-guardar"); b.disabled = true; estado.textContent = "Guardando…";
    try {
      const j = JSON.stringify(P);
      await doc.set({ json: j, actualizado: new Date().toISOString() });
      saved = j; estado.textContent = "Guardado"; actualizarBarra();
    } catch (err) { estado.textContent = "No se pudo guardar: " + (err && err.message ? err.message : "error"); }
    finally { b.disabled = false; }
  }
  async function guardarEnlaces() {
    const st = () => document.getElementById("en-estado");
    if (!dbRef) { if (st()) st().textContent = "No se puede guardar aquí: abre la página desde tu cuenta"; return; }
    try { await dbRef.doc("site/enlaces").set(JSON.parse(JSON.stringify(ENL))); if (st()) st().textContent = "Guardado ✓"; }
    catch (err) { if (st()) st().textContent = "No se pudo guardar: " + (err && err.message ? err.message : "error"); }
  }
  function salir() {
    salirArmado = false; editando = false; panel = null; sel = null; hov = null;
    P = normalizar(JSON.parse(saved)); undo = []; redo = [];
    if (picker) { picker.remove(); picker = null; }
    pintar(); activar(false); pintarPanel(); posBtb();
    bar.querySelector("#b-editar").hidden = false; bar.querySelector("#b-grupo").hidden = true; estado.textContent = "Edición";
  }

  /* ---------- Idiomas ---------- */
  const LANGS = ["es", "ca", "en"], DOCS = { es: "site/pagina", ca: "site/pagina_ca", en: "site/pagina_en" };
  let lang = "es", dbRef = null, unsub = null, primera = true;
  (function () {
    let l = "";
    try { l = new URLSearchParams(location.search).get("lang") || localStorage.getItem("lang") || ""; } catch (e) {}
    if (!LANGS.includes(l)) { const n = String(navigator.language || "es").slice(0, 2).toLowerCase(); l = LANGS.includes(n) ? n : "es"; }
    lang = l; document.documentElement.lang = lang;
  })();
  function badge() { const b = document.getElementById("b-lang"); if (b) b.textContent = lang.toUpperCase(); }
  function cambiarLang(l) {
    if (l === lang || !LANGS.includes(l)) return;
    if (editando) { avisar("Para cambiar de idioma, sal antes del modo edición"); return; }
    lang = l; try { localStorage.setItem("lang", l); } catch (e) {}
    document.documentElement.lang = l; pintar(); conectar(); badge();
  }
  document.addEventListener("click", (e) => { const b = e.target.closest && e.target.closest("[data-lang]"); if (b) cambiarLang(b.dataset.lang); });
  function conectar() {
    if (window.ESTATICO) {                       // versión independiente: el contenido viene en paginas.js
      const PG = window.PAGINAS || {}, d = PG[lang] || PG.es;
      if (d) { P = normalizar(JSON.parse(JSON.stringify(d))); saved = JSON.stringify(P); }
      pintar(); return;
    }
    if (!dbRef) return;
    if (typeof unsub === "function") { try { unsub(); } catch (e) {} }
    unsub = null; doc = dbRef.doc(DOCS[lang]); primera = true;
    const mi = lang;
    const r = doc.onSnapshot(async (snap) => {
      if (mi !== lang) return;
      if (editando && dirty()) return;
      let d = null;
      const leer = (sn) => { if (sn && sn.exists) { const x = sn.data(); if (x && x.json) { try { return normalizar(JSON.parse(x.json)); } catch (e) {} } } return null; };
      d = leer(snap);
      if (!d && mi === "es" && primera) {            // primera vez: recupera lo que se editó con la versión anterior
        try {
          const vieja = dbRef.doc("site/contenido"), s2 = await vieja.get();
          if (s2 && s2.exists) {
            const C2 = clon(CONTENIDO); const o = s2.data();
            ((o && o.ovr) || []).forEach(([p, v]) => { try { setP(C2, p, v); } catch (e) {} });
            d = defaultPage(C2);
          }
        } catch (e) {}
      }
      if (!d && mi !== "es") { try { d = leer(await dbRef.doc(DOCS.es).get()); } catch (e) {} }   // sin traducción: se ve la versión en castellano
      primera = false;
      if (mi !== lang) return;
      if (d) { P = d; saved = JSON.stringify(P); }
      pintar();
    }, () => {});
    if (typeof r === "function") unsub = r;
  }

  /* ---------- Arranque ---------- */
  P = defaultPage(CONTENIDO); saved = JSON.stringify(P); if (!window.ESTATICO) pintar();

  if (window.ESTATICO) { ENL = window.CONFIG || {}; conectar(); return; }
  (async function () {
    try {
      const uso = (n) => Promise.resolve().then(() => window.claude.use(n)).catch(() => null);
      const [db, user, assets] = await Promise.all([uso("db"), uso("user"), uso("assets")]);
      assetsApi = assets || null;
      const alt = async (f) => { try { return user && user[f] ? await user[f]() : null; } catch (e) { return null; } };
      const forzar = /editar/i.test((location.hash || "") + (location.search || ""));
      const puede = forzar || (await alt("canEdit")) === true || (await alt("isOwner")) === true;
      if (puede) { montarBarra(); badge(); }
      if (!db) return;
      dbRef = db; conectar();
      try { dbRef.doc("site/enlaces").onSnapshot((sn) => { if (sn && sn.exists) { ENL = sn.data() || {}; if (!editando) pintar(); } }, () => {}); } catch (e) {}
    } catch (e) { /* la página funciona igual sin edición */ }
  })();
})();

/* Vídeos integrados: se reproducen en el sitio, de uno en uno */
(function () {
  document.addEventListener("click", (e) => {
    const f = e.target.closest && e.target.closest(".vplay");
    if (!f) return;
    const v = f.querySelector("video");
    if (e.target.closest(".vbtn")) {
      document.querySelectorAll(".vplay video").forEach((o) => { if (o !== v) o.pause(); });
      v.controls = true; v.play().catch(() => {});
    }
  });
  document.addEventListener("play", (e) => { if (e.target.closest && e.target.closest(".vplay")) e.target.closest(".vplay").classList.add("on"); }, true);
  document.addEventListener("pause", (e) => { if (e.target.closest && e.target.closest(".vplay")) e.target.closest(".vplay").classList.remove("on"); }, true);
})();

/* Plegables: casos y capítulos de experiencia */
(function () {
  document.addEventListener("click", (e) => {
    if (document.body.classList.contains("editando")) return;
    const t = e.target.closest && e.target.closest(".pleg, .caso-izq .etiqueta, .caso-izq .tt, .cap-num, .cap h3");
    if (!t) return;
    const box = t.closest(".caso, .cap");
    if (!box) return;
    const abrir = box.classList.contains("plegado");
    box.classList.toggle("plegado", !abrir);
    const b = box.querySelector(".pleg"); if (b) b.setAttribute("aria-expanded", abrir ? "true" : "false");
  });
})();

</script>
